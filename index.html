<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Air Quality Map</title>
  </head>
  <body>
    <div id="root">
      <div
        id="loading-splash"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 1rem;
          background: #f8fafc;
          color: #1f2937;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
            Roboto, sans-serif;
          z-index: 9999;
        "
      >
        <div
          style="
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 4px solid #e2e8f0;
            border-top-color: #0ea5e9;
            animation: aqi-splash-spin 1s linear infinite;
          "
        ></div>
        <h1 style="margin: 0; font-size: 1.25rem; font-weight: 700;">
          Global Air Quality Map
        </h1>
        <p style="margin: 0; font-size: 0.875rem; color: #64748b;">
          Loading real-time AQI data...
        </p>
      </div>
      <style>
        @keyframes aqi-splash-spin {
          to {
            transform: rotate(360deg);
          }
        }
        @media (prefers-color-scheme: dark) {
          #loading-splash {
            background: #0f172a !important;
            color: #f8fafc !important;
          }
          #loading-splash p {
            color: #94a3b8 !important;
          }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
