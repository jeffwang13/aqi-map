<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Global Air Quality Map</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      #loading-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #f8fafc;
        color: #1f2937;
        opacity: 1;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
      }

      #loading-splash .spinner {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 4px solid #e2e8f0;
        border-top-color: #0ea5e9;
        animation: aqi-splash-spin 1s linear infinite;
      }

      #loading-splash h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 700;
      }

      #loading-splash p {
        margin: 0;
        font-size: 0.875rem;
        color: #64748b;
      }

      @keyframes aqi-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-color-scheme: dark) {
        #loading-splash {
          background: #0f172a;
          color: #f8fafc;
        }
        #loading-splash p {
          color: #94a3b8;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="loading-splash" aria-hidden="true">
        <div class="spinner"></div>
        <h1>Global Air Quality Map</h1>
        <p>Loading real-time AQI data...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
